<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة القارئ الأنيق</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <h1>📚 أرشيف القارئ: كنوز المعرفة بين يديك</h1>
        <p>اكتشف مجموعتنا من الكتب المختارة بعناية.</p>
    </header>

    <main class="books-grid" id="books-grid">
        <div class="book-card" data-book-id="book1">
            <div class="card-cover">
                <img src="https://via.placeholder.com/150x220/8b4513/ffffff?text=كتاب+1" alt="غلاف كتاب فن اللامبالاة">
            </div>
            <div class="card-info">
                <h2>فن اللامبالاة</h2>
                <p>مارك مانسون</p>
                <span>انقر للقراءة</span>
            </div>
        </div>

        <div class="book-card" data-book-id="book2">
            <div class="card-cover">
                <img src="https://via.placeholder.com/150x220/008080/ffffff?text=كتاب+2" alt="غلاف كتاب قوة عقلك الباطن">
            </div>
            <div class="card-info">
                <h2>قوة عقلك الباطن</h2>
                <p>جوزيف ميرفي</p>
                <span>انقر للقراءة</span>
            </div>
        </div>
        
        </main>
    
    <section class="content-page" id="content-page">
        <button class="back-button" id="back-button">العودة إلى المكتبة</button>
        <div class="content-container">
            <h2 id="content-title">عنوان الكتاب</h2>
            <div id="content-details">
                </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
    </html>
